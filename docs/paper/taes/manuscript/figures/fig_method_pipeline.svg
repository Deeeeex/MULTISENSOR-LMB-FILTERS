<text class="h" x="360.0" y="82" text-anchor="middle">Reference</text>
<text class="s" x="360.0" y="112" text-anchor="middle">median-cardinality medoid</text>
<rect x="494" y="46" width="172" height="90" rx="7" fill="#FEF0D9" stroke="#D55E00" stroke-width="2.2"/>
<text class="h" x="580.0" y="82" text-anchor="middle">Assignment</text>
<text class="s" x="580.0" y="112" text-anchor="middle">Hungarian component map</text>
<rect x="710" y="46" width="186" height="90" rx="7" fill="#EAF4EA" stroke="#009E73" stroke-width="2.2"/>
<text class="h" x="803.0" y="82" text-anchor="middle">Barycenter</text>
<text class="s" x="803.0" y="112" text-anchor="middle">matched posterior moments</text>
<rect x="940" y="46" width="140" height="90" rx="7" fill="#F7F7F7" stroke="#4D4D4D" stroke-width="2.2"/>
<text class="h" x="1010.0" y="82" text-anchor="middle">Output</text>
<text class="s" x="1010.0" y="112" text-anchor="middle">reference labels</text>
<line x1="226" y1="92" x2="258" y2="92" stroke="#4D4D4D" stroke-width="2.5"/>
<polygon points="258,85 270,92 258,99" fill="#4D4D4D"/>
<line x1="450" y1="92" x2="482" y2="92" stroke="#4D4D4D" stroke-width="2.5"/>
<polygon points="482,85 494,92 482,99" fill="#4D4D4D"/>
<line x1="666" y1="92" x2="698" y2="92" stroke="#4D4D4D" stroke-width="2.5"/>
<polygon points="698,85 710,92 698,99" fill="#4D4D4D"/>
<line x1="896" y1="92" x2="928" y2="92" stroke="#4D4D4D" stroke-width="2.5"/>
