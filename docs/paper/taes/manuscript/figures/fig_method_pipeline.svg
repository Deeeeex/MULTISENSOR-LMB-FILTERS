<text class="h" x="210.0" y="182" text-anchor="middle">1 Reference</text>
<text class="s" x="210.0" y="211" text-anchor="middle">median-cardinality medoid</text>
<rect x="430" y="148" width="260" height="76" rx="7" fill="#FEF0D9" stroke="#D55E00" stroke-width="2.2"/>
<text class="h" x="560.0" y="182" text-anchor="middle">2 Assignment</text>
<text class="s" x="560.0" y="211" text-anchor="middle">tracks to reference labels</text>
<rect x="780" y="148" width="260" height="76" rx="7" fill="#EAF4EA" stroke="#009E73" stroke-width="2.2"/>
<text class="h" x="910.0" y="182" text-anchor="middle">3 Barycenter</text>
<text class="s" x="910.0" y="211" text-anchor="middle">matched first two moments</text>
<line x1="340" y1="186" x2="418" y2="186" stroke="#4D4D4D" stroke-width="2.5"/>
<polygon points="418,179 430,186 418,193" fill="#4D4D4D"/>
<line x1="690" y1="186" x2="768" y2="186" stroke="#4D4D4D" stroke-width="2.5"/>
<polygon points="768,179 780,186 768,193" fill="#4D4D4D"/>
<rect x="95" y="260" width="930" height="50" rx="5" fill="#FFFFFF" stroke="#777" stroke-width="1.5"/>
<text class="tiny" x="560" y="290" text-anchor="middle">Output: pass through upstream active-track existence scores; rewrite only labels and Gaussian moments.</text>
<rect x="120" y="346" width="880" height="46" rx="5" fill="#F7F7F7" stroke="#777" stroke-width="1.5"/>
<text class="tiny" x="560" y="374" text-anchor="middle">Repeat for H graph-local rounds over N_s; no global label dictionary is read or constructed.</text>
