<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background-color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3640"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6f9c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a3b3b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f8f6b"/>
    </marker>
  </defs>

  <style>
    .panel { fill:#ffffff; stroke:#d8dee6; stroke-width:1.5; }
    .panel-soft { fill:#f8fafc; stroke:#d8dee6; stroke-width:1.2; }
    .title { font-size:18px; font-weight:700; fill:#2f3640; }
    .subtitle { font-size:12px; fill:#6b7280; }
    .section { font-size:14px; font-weight:700; fill:#4b5563; }
    .node { fill:#ffffff; stroke:#5d6b7a; stroke-width:1.8; }
    .node-focus { fill:#fbf0f0; stroke:#8a3b3b; stroke-width:2.4; }
    .node-text { font-size:12px; font-weight:700; fill:#2f3640; text-anchor:middle; dominant-baseline:middle; }
    .link-solid { stroke:#3f6f9c; stroke-width:2.2; fill:none; }
    .link-dash { stroke:#3f6f9c; stroke-width:1.9; stroke-dasharray:7,5; fill:none; }
    .link-dot { stroke:#3f6f9c; stroke-width:1.9; stroke-dasharray:2,6; fill:none; }
    .flow { stroke:#2f3640; stroke-width:1.7; fill:none; }
    .flow-blue { stroke:#3f6f9c; stroke-width:1.8; fill:none; }
    .flow-red { stroke:#8a3b3b; stroke-width:1.9; fill:none; }
    .flow-green { stroke:#2f8f6b; stroke-width:1.8; fill:none; }
    .card { fill:#ffffff; stroke:#7d8794; stroke-width:1.4; }
    .card-blue { fill:#eef5fb; stroke:#4e789f; stroke-width:1.5; }
    .card-red { fill:#fff6f6; stroke:#9b4949; stroke-width:1.5; }
    .card-green { fill:#f1fbf6; stroke:#2f8f6b; stroke-width:1.5; }
    .method-bg { fill:#fff8f8; stroke:#9b4949; stroke-width:1.5; }
    .chip { fill:#ffffff; stroke:#c16464; stroke-width:1.1; }
    .chip-text { font-size:11.5px; fill:#4b5563; text-anchor:middle; dominant-baseline:middle; }
    .label { font-size:13px; font-weight:700; fill:#2f3640; text-anchor:middle; dominant-baseline:middle; }
    .label-red { font-size:13px; font-weight:700; fill:#762323; text-anchor:middle; dominant-baseline:middle; }
    .label-green { font-size:13px; font-weight:700; fill:#2f8f6b; text-anchor:middle; dominant-baseline:middle; }
    .small { font-size:11.5px; fill:#4b5563; text-anchor:middle; dominant-baseline:middle; }
    .note { font-size:10.5px; fill:#687385; text-anchor:middle; dominant-baseline:middle; }
  </style>

  <text x="54" y="42" class="title">Distributed formation-tracking setting</text>
  <text x="486" y="42" class="title">Information available at fusion node s</text>
  <text x="844" y="42" class="title">Branch-Decoupled Adaptive Fusion</text>

  <rect x="42" y="72" width="390" height="584" rx="8" class="panel"/>
  <rect x="464" y="72" width="286" height="584" rx="8" class="panel"/>
  <rect x="782" y="72" width="456" height="584" rx="8" class="panel"/>

  <text x="236" y="102" class="section" text-anchor="middle">Eight sensors in two cooperative formations</text>
  <text x="607" y="102" class="section" text-anchor="middle">Local and neighbor evidence at node s</text>
  <text x="1010" y="102" class="section" text-anchor="middle">Branch-specific weight allocation</text>

  <rect x="82" y="132" width="306" height="178" rx="7" class="panel-soft"/>
  <rect x="82" y="362" width="306" height="178" rx="7" class="panel-soft"/>
  <text x="118" y="126" class="subtitle">Formation A</text>
  <text x="118" y="356" class="subtitle">Formation B</text>

  <line x1="150" y1="188" x2="292" y2="188" class="link-solid"/>
  <line x1="150" y1="188" x2="150" y2="266" class="link-dash"/>
  <line x1="292" y1="188" x2="292" y2="266" class="link-solid"/>
  <line x1="150" y1="266" x2="292" y2="266" class="link-dash"/>
  <line x1="150" y1="266" x2="292" y2="188" class="link-dot"/>

  <line x1="150" y1="418" x2="292" y2="418" class="link-solid"/>
  <line x1="150" y1="418" x2="150" y2="496" class="link-dot"/>
  <line x1="292" y1="418" x2="292" y2="496" class="link-dash"/>
  <line x1="150" y1="496" x2="292" y2="496" class="link-solid"/>
  <line x1="150" y1="496" x2="292" y2="418" class="link-dot"/>
  <path d="M 292 266 C 272 314, 210 350, 150 418" class="link-dot"/>

  <circle cx="150" cy="188" r="18" class="node"/>
  <text x="150" y="188" class="node-text">S1</text>
  <circle cx="292" cy="188" r="18" class="node"/>
  <text x="292" y="188" class="node-text">S2</text>
  <circle cx="150" cy="266" r="18" class="node"/>
  <text x="150" y="266" class="node-text">S3</text>
  <circle cx="292" cy="266" r="21" class="node-focus"/>
  <text x="292" y="266" class="node-text">s</text>
  <circle cx="150" cy="418" r="18" class="node"/>
  <text x="150" y="418" class="node-text">S5</text>
  <circle cx="292" cy="418" r="18" class="node"/>
  <text x="292" y="418" class="node-text">S6</text>
  <circle cx="150" cy="496" r="18" class="node"/>
  <text x="150" y="496" class="node-text">S7</text>
  <circle cx="292" cy="496" r="18" class="node"/>
  <text x="292" y="496" class="node-text">S8</text>

  <line x1="104" y1="594" x2="146" y2="594" class="link-solid"/>
  <text x="204" y="594" class="subtitle">high-reliability link</text>
  <line x1="104" y1="616" x2="146" y2="616" class="link-dash"/>
  <text x="200" y="616" class="subtitle">moderate link</text>
  <line x1="104" y1="638" x2="146" y2="638" class="link-dot"/>
  <text x="187" y="638" class="subtitle">lossy link</text>

  <path d="M 326 266 C 390 270, 428 294, 464 326" class="flow-blue" marker-end="url(#arrow-blue)"/>
  <text x="390" y="252" class="note">node s receives</text>
  <text x="390" y="266" class="note">neighbor posteriors</text>

  <rect x="506" y="134" width="202" height="64" rx="6" class="card"/>
  <text x="607" y="160" class="label">Local measurements</text>
  <text x="607" y="181" class="small">measurement update at node s</text>
  <line x1="607" y1="198" x2="607" y2="246" class="flow" marker-end="url(#arrow-dark)"/>
  <rect x="498" y="248" width="218" height="78" rx="6" class="card-blue"/>
  <text x="607" y="277" class="label">Local LMB posterior</text>
  <text x="607" y="300" class="small">kinematic states and existence</text>

  <rect x="498" y="424" width="218" height="86" rx="6" class="card-blue"/>
  <text x="607" y="453" class="label">Neighbor information</text>
  <text x="607" y="476" class="small">posteriors inside the neighborhood</text>
  <text x="607" y="496" class="small">and realized link outcomes</text>

  <path d="M 716 287 C 752 286, 768 268, 800 252" class="flow" marker-end="url(#arrow-dark)"/>
  <path d="M 716 467 C 754 444, 774 408, 806 370" class="flow-blue" marker-end="url(#arrow-blue)"/>

  <rect x="820" y="132" width="382" height="446" rx="8" class="method-bg"/>
  <text x="1011" y="162" class="label-red">Branch-Decoupled Adaptive Fusion</text>
  <text x="1011" y="184" class="small">communication-aware GA-LMB weights</text>

  <rect x="852" y="214" width="88" height="30" rx="15" class="chip"/>
  <rect x="950" y="214" width="100" height="30" rx="15" class="chip"/>
  <rect x="1060" y="214" width="106" height="30" rx="15" class="chip"/>
  <text x="896" y="227" class="chip-text">posterior</text>
  <text x="896" y="239" class="note">precision</text>
  <text x="1000" y="227" class="chip-text">link</text>
  <text x="1000" y="239" class="note">reliability</text>
  <text x="1113" y="227" class="chip-text">existence</text>
  <text x="1113" y="239" class="note">confidence</text>

  <rect x="906" y="282" width="210" height="58" rx="6" class="card-red"/>
  <text x="1011" y="306" class="label-red">Shared quality score</text>
  <text x="1011" y="326" class="small">common evidence before branch split</text>
  <line x1="1011" y1="244" x2="1011" y2="282" class="flow-red" marker-end="url(#arrow-red)"/>

  <path d="M 1011 340 C 978 372, 938 392, 900 414" class="flow-red" marker-end="url(#arrow-red)"/>
  <path d="M 1011 340 C 1044 372, 1084 392, 1122 414" class="flow-red" marker-end="url(#arrow-red)"/>

  <rect x="842" y="416" width="152" height="62" rx="6" class="card-red"/>
  <text x="918" y="441" class="label-red">Spatial-weight path</text>
  <text x="918" y="463" class="small">kinematic KLA fusion</text>

  <rect x="1028" y="416" width="152" height="62" rx="6" class="card-red"/>
  <text x="1104" y="441" class="label-red">Existence-weight path</text>
  <text x="1104" y="463" class="small">Bernoulli fusion</text>

  <rect x="852" y="510" width="150" height="44" rx="6" class="card-green"/>
  <text x="927" y="527" class="label-green">FID-FIA cue</text>
  <text x="927" y="545" class="small">existence branch only</text>
  <path d="M 1002 532 C 1032 528, 1052 504, 1080 478" class="flow-green" marker-end="url(#arrow-green)"/>

  <rect x="1030" y="594" width="172" height="46" rx="6" class="card-blue"/>
  <text x="1116" y="613" class="label">Fused LMB posterior</text>
  <text x="1116" y="632" class="small">for extraction and forwarding</text>
  <path d="M 842 447 C 800 525, 876 626, 1030 618" class="flow" marker-end="url(#arrow-dark)"/>
  <path d="M 1104 478 C 1108 530, 1112 566, 1116 594" class="flow" marker-end="url(#arrow-dark)"/>
</svg>
