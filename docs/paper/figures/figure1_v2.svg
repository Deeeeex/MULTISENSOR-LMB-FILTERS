<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background-color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3640"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f7aa2"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d3d3d"/>
    </marker>
  </defs>

  <style>
    .panel { fill: none; stroke: #d8dde3; stroke-width: 1.4; }
    .formation { fill: none; stroke: #c7cfd8; stroke-width: 1.2; stroke-dasharray: 6,4; }
    .section-title { font-size: 17px; font-weight: 700; fill: #2f3640; }
    .subtle { font-size: 12px; fill: #697586; }
    .formation-title { font-size: 13px; font-weight: 700; fill: #6b7280; }

    .node { fill: #ffffff; stroke: #5f6f82; stroke-width: 1.5; }
    .node-text { font-size: 12px; font-weight: 700; fill: #2f3640; text-anchor: middle; dominant-baseline: middle; }
    .node-focus { fill: #fbefef; stroke: #8d3d3d; stroke-width: 2.4; }

    .link-reliable { stroke: #4f7aa2; stroke-width: 2.0; fill: none; }
    .link-moderate { stroke: #4f7aa2; stroke-width: 1.8; stroke-dasharray: 8,5; fill: none; }
    .link-lossy { stroke: #4f7aa2; stroke-width: 1.8; stroke-dasharray: 2,6; fill: none; }
    .anno-red { stroke: #8d3d3d; stroke-width: 1.6; fill: none; }
    .flow { stroke: #2f3640; stroke-width: 1.6; fill: none; }
    .flow-blue { stroke: #4f7aa2; stroke-width: 1.6; fill: none; }
    .flow-red { stroke: #8d3d3d; stroke-width: 1.7; fill: none; }

    .box-neutral { fill: #ffffff; stroke: #7b8795; stroke-width: 1.3; }
    .box-local { fill: #eef4f9; stroke: #5f7ea0; stroke-width: 1.3; }
    .box-adapt { fill: #faecec; stroke: #8d3d3d; stroke-width: 1.5; }
    .box-branch { fill: #fff8f8; stroke: #8d3d3d; stroke-width: 1.4; }
    .chip { fill: #ffffff; stroke: #b55a5a; stroke-width: 1.0; }
    .box-output { fill: #eef4f9; stroke: #5f7ea0; stroke-width: 1.4; }

    .label-main { font-size: 13px; font-weight: 700; fill: #2f3640; text-anchor: middle; }
    .label-small { font-size: 12px; fill: #2f3640; text-anchor: middle; }
    .label-adapt { font-size: 13px; font-weight: 700; fill: #6f2020; text-anchor: middle; }
    .label-note { font-size: 11px; fill: #6b7280; }
    .note-bg { fill: #ffffff; opacity: 0.94; }
    .legend { font-size: 11px; fill: #596574; dominant-baseline: middle; }
  </style>

  <!-- Main panels -->
  <rect x="40" y="56" width="380" height="608" rx="8" class="panel"/>
  <rect x="458" y="56" width="782" height="608" rx="8" class="panel"/>

  <text x="58" y="36" class="section-title">Distributed Eight-Sensor Setting</text>
  <text x="476" y="36" class="section-title">Local Adaptive Fusion at Node s</text>

  <!-- Left: network setting -->
  <rect x="74" y="104" width="312" height="204" rx="8" class="formation"/>
  <rect x="74" y="364" width="312" height="204" rx="8" class="formation"/>
  <text x="92" y="94" class="formation-title">Formation A (Sensors 1 to 4)</text>
  <text x="92" y="354" class="formation-title">Formation B (Sensors 5 to 8)</text>

  <!-- Links in formation A -->
  <line x1="148" y1="186" x2="298" y2="186" class="link-reliable"/>
  <line x1="148" y1="186" x2="148" y2="274" class="link-moderate"/>
  <line x1="298" y1="186" x2="298" y2="274" class="link-reliable"/>
  <line x1="148" y1="274" x2="298" y2="274" class="link-moderate"/>
  <line x1="298" y1="186" x2="148" y2="274" class="link-lossy"/>

  <!-- Links in formation B -->
  <line x1="148" y1="446" x2="298" y2="446" class="link-reliable"/>
  <line x1="148" y1="446" x2="148" y2="534" class="link-lossy"/>
  <line x1="298" y1="446" x2="298" y2="534" class="link-moderate"/>
  <line x1="148" y1="534" x2="298" y2="534" class="link-reliable"/>
  <line x1="148" y1="534" x2="298" y2="446" class="link-lossy"/>

  <!-- Sparse inter-group link -->
  <line x1="298" y1="274" x2="148" y2="446" class="link-lossy"/>
  <rect x="160" y="322" width="112" height="18" rx="4" class="note-bg"/>
  <text x="216" y="335" class="label-note" text-anchor="middle">inter-group link</text>

  <!-- Nodes -->
  <circle cx="148" cy="186" r="18" class="node"/>
  <text x="148" y="186" class="node-text">S1</text>
  <circle cx="298" cy="186" r="18" class="node"/>
  <text x="298" y="186" class="node-text">S2</text>
  <circle cx="148" cy="274" r="18" class="node"/>
  <text x="148" y="274" class="node-text">S3</text>
  <circle cx="298" cy="274" r="20" class="node-focus"/>
  <text x="298" y="274" class="node-text">s</text>

  <circle cx="148" cy="446" r="18" class="node"/>
  <text x="148" y="446" class="node-text">S5</text>
  <circle cx="298" cy="446" r="18" class="node"/>
  <text x="298" y="446" class="node-text">S6</text>
  <circle cx="148" cy="534" r="18" class="node"/>
  <text x="148" y="534" class="node-text">S7</text>
  <circle cx="298" cy="534" r="18" class="node"/>
  <text x="298" y="534" class="node-text">S8</text>

  <!-- Callout for representative node -->
  <rect x="320" y="198" width="128" height="18" rx="4" class="note-bg"/>
  <text x="384" y="211" class="label-note" text-anchor="middle">node s expanded at right</text>
  <path d="M 320 274 C 360 270, 402 260, 448 244" class="anno-red" marker-end="url(#arrow-red)"/>

  <!-- Link quality legend -->
  <line x1="92" y1="606" x2="132" y2="606" class="link-reliable"/>
  <text x="144" y="606" class="legend">reliable link</text>
  <line x1="92" y1="628" x2="132" y2="628" class="link-moderate"/>
  <text x="144" y="628" class="legend">moderate link</text>
  <line x1="236" y1="617" x2="276" y2="617" class="link-lossy"/>
  <text x="288" y="617" class="legend">lossy link</text>

  <!-- Right: representative node pipeline -->
  <text x="520" y="92" class="formation-title">Local posterior at node s</text>
  <text x="760" y="92" class="formation-title">Adaptive fusion module at node s</text>
  <text x="1070" y="92" class="formation-title">Branch outputs</text>

  <!-- Input boxes -->
  <rect x="522" y="130" width="168" height="56" rx="5" class="box-neutral"/>
  <text x="606" y="153" class="label-main">Measurements</text>
  <text x="606" y="171" class="label-small">local sensing</text>

  <line x1="606" y1="186" x2="606" y2="232" class="flow" marker-end="url(#arrow-dark)"/>

  <rect x="502" y="234" width="208" height="70" rx="5" class="box-local"/>
  <text x="606" y="262" class="label-main">Local LMB Posterior</text>
  <text x="606" y="281" class="label-small">Bayesian posterior at node s</text>

  <rect x="500" y="430" width="212" height="78" rx="5" class="box-local"/>
  <text x="606" y="456" class="label-main">Neighbor Messages</text>
  <text x="606" y="475" class="label-small">neighbor posteriors</text>
  <text x="606" y="494" class="label-small">and realized link outcomes</text>

  <!-- Arrows from left network to right panel -->
  <path d="M 320 294 C 388 330, 432 392, 500 458" class="flow-blue" marker-end="url(#arrow-blue)"/>
  <rect x="344" y="394" width="162" height="18" rx="4" class="note-bg"/>
  <text x="425" y="407" class="label-note" text-anchor="middle">messages to node s</text>

  <!-- Adaptive module -->
  <rect x="760" y="126" width="254" height="434" rx="6" class="box-adapt"/>
  <text x="887" y="154" class="label-adapt">Adaptive KLA Fusion</text>
  <text x="887" y="172" class="label-small" fill="#6f2020">local fusion at node s</text>

  <!-- Factor chips -->
  <rect x="784" y="198" width="68" height="28" rx="14" class="chip"/>
  <rect x="856" y="198" width="78" height="28" rx="14" class="chip"/>
  <rect x="938" y="198" width="66" height="28" rx="14" class="chip"/>
  <text x="818" y="216" class="legend" text-anchor="middle">covariance</text>
  <text x="895" y="216" class="legend" text-anchor="middle">link quality</text>
  <text x="971" y="216" class="legend" text-anchor="middle">exist. conf.</text>

  <rect x="808" y="254" width="158" height="70" rx="5" class="chip"/>
  <text x="887" y="280" class="label-adapt">Adaptive Weight</text>
  <text x="887" y="299" class="label-small" fill="#6f2020">allocation</text>

  <line x1="710" y1="268" x2="808" y2="268" class="flow" marker-end="url(#arrow-dark)"/>
  <line x1="712" y1="470" x2="808" y2="310" class="flow-blue" marker-end="url(#arrow-blue)"/>

  <!-- Branch split -->
  <line x1="887" y1="324" x2="887" y2="356" class="flow-red" marker-end="url(#arrow-red)"/>
  <line x1="887" y1="356" x2="850" y2="402" class="flow-red" marker-end="url(#arrow-red)"/>
  <line x1="887" y1="356" x2="924" y2="402" class="flow-red" marker-end="url(#arrow-red)"/>

  <rect x="784" y="404" width="132" height="52" rx="5" class="box-branch"/>
  <text x="850" y="426" class="label-adapt">Spatial Weights</text>
  <text x="850" y="444" class="label-small" fill="#6f2020">for kinematic fusion</text>

  <rect x="858" y="476" width="132" height="52" rx="5" class="box-branch"/>
  <text x="924" y="498" class="label-adapt">Existence Weights</text>
  <text x="924" y="516" class="label-small" fill="#6f2020">for Bernoulli fusion</text>

  <!-- Output branch boxes -->
  <rect x="1072" y="270" width="124" height="54" rx="5" class="box-branch"/>
  <text x="1134" y="292" class="label-adapt">Spatial Branch</text>
  <text x="1134" y="310" class="label-small" fill="#6f2020">Gaussian KLA update</text>

  <rect x="1072" y="392" width="124" height="54" rx="5" class="box-branch"/>
  <text x="1134" y="414" class="label-adapt">Existence Branch</text>
  <text x="1134" y="432" class="label-small" fill="#6f2020">Bernoulli update</text>

  <line x1="916" y1="430" x2="1072" y2="297" class="flow-red" marker-end="url(#arrow-red)"/>
  <line x1="990" y1="502" x2="1072" y2="419" class="flow-red" marker-end="url(#arrow-red)"/>

  <!-- Final output -->
  <rect x="1040" y="546" width="182" height="72" rx="5" class="box-output"/>
  <text x="1131" y="574" class="label-main">Fused Local Posterior</text>
  <text x="1131" y="593" class="label-small">branch-combined posterior</text>
  <text x="1131" y="612" class="label-small">for extraction and forwarding</text>

  <line x1="1134" y1="324" x2="1134" y2="546" class="flow" marker-end="url(#arrow-dark)"/>
  <line x1="1134" y1="446" x2="1134" y2="546" class="flow" marker-end="url(#arrow-dark)"/>

</svg>
