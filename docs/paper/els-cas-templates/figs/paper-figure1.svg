<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead for Signal Flow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
    
    <!-- Arrowheads for Communication Links (Bidirectional) -->
    <marker id="comm-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#2d69a5" />
    </marker>
    <marker id="comm-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d69a5" />
    </marker>
  </defs>

  <style>
    .node-bg { fill: none; stroke: #cccccc; stroke-width: 1.5; stroke-dasharray: 6,4; }
    .box-meas { fill: #ffffff; stroke: #666666; stroke-width: 1.2; }
    .box-lmb { fill: #f0f4f8; stroke: #5c80a6; stroke-width: 1.2; }
    .box-fuse { fill: #e6edf4; stroke: #5c80a6; stroke-width: 1.2; }
    .box-adapt { fill: #faecec; stroke: #a84040; stroke-width: 1.5; }
    .box-branch { fill: #ffffff; stroke: #a84040; stroke-width: 1.5; }
    
    .flow-line { stroke: #333333; stroke-width: 1.2; fill: none; }
    .comm-line { stroke: #2d69a5; stroke-width: 1.2; stroke-dasharray: 5,3; fill: none; }
    
    .txt-group { font-size: 14px; font-weight: bold; fill: #666666; }
    .txt-node { font-size: 13px; font-weight: bold; fill: #333333; }
    .txt-main { font-size: 12px; fill: #333333; text-anchor: middle; }
    .txt-adapt { font-size: 13px; font-weight: bold; fill: #661414; text-anchor: middle; }
    .txt-branch { font-size: 12px; font-weight: bold; fill: #661414; text-anchor: middle; }
    .txt-legend { font-size: 12px; fill: #555555; dominant-baseline: middle; }
  </style>

  <!-- ================= BACKGROUND GROUPINGS ================= -->
  <!-- Formation 1 Bounding Box -->
  <rect x="30" y="45" width="510" height="280" rx="6" class="node-bg" />
  <text x="45" y="35" class="txt-group">Formation 1 (Nodes 1–4)</text>

  <!-- Formation 2 Bounding Box -->
  <rect x="30" y="385" width="510" height="280" rx="6" class="node-bg" />
  <text x="45" y="375" class="txt-group">Formation 2 (Nodes 5–8)</text>

  <!-- ================= COMMUNICATION LINKS (Drawn first to be behind signal flow) ================= -->
  <!-- Group 1 Inter-node Links (Vertical) -->
  <line x1="460" y1="105" x2="460" y2="125" class="comm-line" marker-start="url(#comm-start)" marker-end="url(#comm-end)" />
  <line x1="460" y1="175" x2="460" y2="195" class="comm-line" marker-start="url(#comm-start)" marker-end="url(#comm-end)" />
  <line x1="460" y1="245" x2="460" y2="265" class="comm-line" marker-start="url(#comm-start)" marker-end="url(#comm-end)" />
  <!-- Group 1 Loop (S1 to S4) -->
  <path d="M 396,80 C 355,110 355,260 396,290" class="comm-line" marker-start="url(#comm-start)" marker-end="url(#comm-end)" />

  <!-- Group 2 Inter-node Links (Vertical) -->
  <line x1="460" y1="445" x2="460" y2="465" class="comm-line" marker-start="url(#comm-start)" marker-end="url(#comm-end)" />
  <line x1="460" y1="515" x2="460" y2="535" class="comm-line" marker-start="url(#comm-start)" marker-end="url(#comm-end)" />
  <line x1="460" y1="585" x2="460" y2="605" class="comm-line" marker-start="url(#comm-start)" marker-end="url(#comm-end)" />
  <!-- Group 2 Loop (S5 to S8) -->
  <path d="M 396,420 C 355,450 355,600 396,630" class="comm-line" marker-start="url(#comm-start)" marker-end="url(#comm-end)" />

  <!-- Sparse Inter-Group Link (S4 to S5) -->
  <line x1="460" y1="315" x2="460" y2="395" class="comm-line" marker-start="url(#comm-start)" marker-end="url(#comm-end)" />


  <!-- ================= PIPELINE SENSOR NODES ================= -->
  
  <!-- === GROUP 1 === -->
  <!-- NODE 1 (Y = 80) -->
  <text x="45" y="84" class="txt-node">S<tspan baseline-shift="sub" font-size="10">1</tspan></text>
  <rect x="75" y="60" width="90" height="40" rx="3" class="box-meas" />
  <text x="120" y="76" class="txt-main">Local<tspan x="120" dy="14">Measurements</tspan></text>
  <line x1="165" y1="80" x2="195" y2="80" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="200" y="60" width="140" height="40" rx="3" class="box-lmb" />
  <text x="270" y="76" class="txt-main">Measurement-Updated<tspan x="270" dy="14">LMB Posterior</tspan></text>
  <line x1="340" y1="80" x2="395" y2="80" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="400" y="60" width="120" height="40" rx="3" class="box-fuse" />
  <text x="460" y="76" class="txt-main">Neighborhood<tspan x="460" dy="14">Fusion</tspan></text>
  <path d="M 520,80 C 620,80 620,238 715,238" class="flow-line" marker-end="url(#arrow)" />

  <!-- NODE 2 (Y = 150) -->
  <text x="45" y="154" class="txt-node">S<tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <rect x="75" y="130" width="90" height="40" rx="3" class="box-meas" />
  <text x="120" y="146" class="txt-main">Local<tspan x="120" dy="14">Measurements</tspan></text>
  <line x1="165" y1="150" x2="195" y2="150" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="200" y="130" width="140" height="40" rx="3" class="box-lmb" />
  <text x="270" y="146" class="txt-main">Measurement-Updated<tspan x="270" dy="14">LMB Posterior</tspan></text>
  <line x1="340" y1="150" x2="395" y2="150" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="400" y="130" width="120" height="40" rx="3" class="box-fuse" />
  <text x="460" y="146" class="txt-main">Neighborhood<tspan x="460" dy="14">Fusion</tspan></text>
  <path d="M 520,150 C 620,150 620,271 715,271" class="flow-line" marker-end="url(#arrow)" />

  <!-- NODE 3 (Y = 220) -->
  <text x="45" y="224" class="txt-node">S<tspan baseline-shift="sub" font-size="10">3</tspan></text>
  <rect x="75" y="200" width="90" height="40" rx="3" class="box-meas" />
  <text x="120" y="216" class="txt-main">Local<tspan x="120" dy="14">Measurements</tspan></text>
  <line x1="165" y1="220" x2="195" y2="220" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="200" y="200" width="140" height="40" rx="3" class="box-lmb" />
  <text x="270" y="216" class="txt-main">Measurement-Updated<tspan x="270" dy="14">LMB Posterior</tspan></text>
  <line x1="340" y1="220" x2="395" y2="220" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="400" y="200" width="120" height="40" rx="3" class="box-fuse" />
  <text x="460" y="216" class="txt-main">Neighborhood<tspan x="460" dy="14">Fusion</tspan></text>
  <path d="M 520,220 C 620,220 620,304 715,304" class="flow-line" marker-end="url(#arrow)" />

  <!-- NODE 4 (Y = 290) -->
  <text x="45" y="294" class="txt-node">S<tspan baseline-shift="sub" font-size="10">4</tspan></text>
  <rect x="75" y="270" width="90" height="40" rx="3" class="box-meas" />
  <text x="120" y="286" class="txt-main">Local<tspan x="120" dy="14">Measurements</tspan></text>
  <line x1="165" y1="290" x2="195" y2="290" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="200" y="270" width="140" height="40" rx="3" class="box-lmb" />
  <text x="270" y="286" class="txt-main">Measurement-Updated<tspan x="270" dy="14">LMB Posterior</tspan></text>
  <line x1="340" y1="290" x2="395" y2="290" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="400" y="270" width="120" height="40" rx="3" class="box-fuse" />
  <text x="460" y="286" class="txt-main">Neighborhood<tspan x="460" dy="14">Fusion</tspan></text>
  <path d="M 520,290 C 620,290 620,338 715,338" class="flow-line" marker-end="url(#arrow)" />


  <!-- === GROUP 2 === -->
  <!-- NODE 5 (Y = 420) -->
  <text x="45" y="424" class="txt-node">S<tspan baseline-shift="sub" font-size="10">5</tspan></text>
  <rect x="75" y="400" width="90" height="40" rx="3" class="box-meas" />
  <text x="120" y="416" class="txt-main">Local<tspan x="120" dy="14">Measurements</tspan></text>
  <line x1="165" y1="420" x2="195" y2="420" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="200" y="400" width="140" height="40" rx="3" class="box-lmb" />
  <text x="270" y="416" class="txt-main">Measurement-Updated<tspan x="270" dy="14">LMB Posterior</tspan></text>
  <line x1="340" y1="420" x2="395" y2="420" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="400" y="400" width="120" height="40" rx="3" class="box-fuse" />
  <text x="460" y="416" class="txt-main">Neighborhood<tspan x="460" dy="14">Fusion</tspan></text>
  <path d="M 520,420 C 620,420 620,371 715,371" class="flow-line" marker-end="url(#arrow)" />

  <!-- NODE 6 (Y = 490) -->
  <text x="45" y="494" class="txt-node">S<tspan baseline-shift="sub" font-size="10">6</tspan></text>
  <rect x="75" y="470" width="90" height="40" rx="3" class="box-meas" />
  <text x="120" y="486" class="txt-main">Local<tspan x="120" dy="14">Measurements</tspan></text>
  <line x1="165" y1="490" x2="195" y2="490" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="200" y="470" width="140" height="40" rx="3" class="box-lmb" />
  <text x="270" y="486" class="txt-main">Measurement-Updated<tspan x="270" dy="14">LMB Posterior</tspan></text>
  <line x1="340" y1="490" x2="395" y2="490" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="400" y="470" width="120" height="40" rx="3" class="box-fuse" />
  <text x="460" y="486" class="txt-main">Neighborhood<tspan x="460" dy="14">Fusion</tspan></text>
  <path d="M 520,490 C 620,490 620,404 715,404" class="flow-line" marker-end="url(#arrow)" />

  <!-- NODE 7 (Y = 560) -->
  <text x="45" y="564" class="txt-node">S<tspan baseline-shift="sub" font-size="10">7</tspan></text>
  <rect x="75" y="540" width="90" height="40" rx="3" class="box-meas" />
  <text x="120" y="556" class="txt-main">Local<tspan x="120" dy="14">Measurements</tspan></text>
  <line x1="165" y1="560" x2="195" y2="560" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="200" y="540" width="140" height="40" rx="3" class="box-lmb" />
  <text x="270" y="556" class="txt-main">Measurement-Updated<tspan x="270" dy="14">LMB Posterior</tspan></text>
  <line x1="340" y1="560" x2="395" y2="560" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="400" y="540" width="120" height="40" rx="3" class="box-fuse" />
  <text x="460" y="556" class="txt-main">Neighborhood<tspan x="460" dy="14">Fusion</tspan></text>
  <path d="M 520,560 C 620,560 620,438 715,438" class="flow-line" marker-end="url(#arrow)" />

  <!-- NODE 8 (Y = 630) -->
  <text x="45" y="634" class="txt-node">S<tspan baseline-shift="sub" font-size="10">8</tspan></text>
  <rect x="75" y="610" width="90" height="40" rx="3" class="box-meas" />
  <text x="120" y="626" class="txt-main">Local<tspan x="120" dy="14">Measurements</tspan></text>
  <line x1="165" y1="630" x2="195" y2="630" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="200" y="610" width="140" height="40" rx="3" class="box-lmb" />
  <text x="270" y="626" class="txt-main">Measurement-Updated<tspan x="270" dy="14">LMB Posterior</tspan></text>
  <line x1="340" y1="630" x2="395" y2="630" class="flow-line" marker-end="url(#arrow)" />
  
  <rect x="400" y="610" width="120" height="40" rx="3" class="box-fuse" />
  <text x="460" y="626" class="txt-main">Neighborhood<tspan x="460" dy="14">Fusion</tspan></text>
  <path d="M 520,630 C 620,630 620,471 715,471" class="flow-line" marker-end="url(#arrow)" />


  <!-- ================= SHARED ADAPTIVE FUSION BLOCK ================= -->
  <!-- Large Central Block -->
  <rect x="720" y="205" width="160" height="300" rx="4" class="box-adapt" />
  <text x="800" y="347" class="txt-adapt">Adaptive GA/KLA<tspan x="800" dy="16">Fusion</tspan></text>

  <!-- Flow to Outputs -->
  <line x1="880" y1="280" x2="915" y2="280" class="flow-line" marker-end="url(#arrow)" />
  <line x1="880" y1="430" x2="915" y2="430" class="flow-line" marker-end="url(#arrow)" />


  <!-- ================= BRANCH OUTPUTS ================= -->
  <!-- Spatial Branch -->
  <rect x="920" y="260" width="120" height="40" rx="3" class="box-branch" />
  <text x="980" y="284" class="txt-branch">Spatial Branch</text>

  <!-- Existence Branch -->
  <rect x="920" y="410" width="120" height="40" rx="3" class="box-branch" />
  <text x="980" y="434" class="txt-branch">Existence Branch</text>


  <!-- ================= LEGEND ================= -->
  <g transform="translate(730, 580)">
    <!-- Legend Items -->
    <line x1="0" y1="10" x2="35" y2="10" class="flow-line" marker-end="url(#arrow)" />
    <text x="45" y="10" class="txt-legend">Signal / Processing Flow</text>
    
    <line x1="0" y1="40" x2="35" y2="40" class="comm-line" marker-start="url(#comm-start)" marker-end="url(#comm-end)" />
    <text x="45" y="40" class="txt-legend">Neighborhood Message Passing</text>
    
    <rect x="0" y="63" width="35" height="14" class="node-bg" />
    <text x="45" y="70" class="txt-legend">Spatial Group (Formation)</text>
  </g>

</svg>