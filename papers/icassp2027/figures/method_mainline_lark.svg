<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <title>稀疏因果路由与实际投递后的逐标签 LMB-KLA 融合</title>
  <desc>V242 已实现的计划路由由编队内有向环和编队间双向网关树组成。当前物理信息和上一轮路由决定计划，不使用未来或真值。实际投递受丢包影响。接收示例中主要邻居的 0.70 权重丢失后，当前基线重新归一化到自身 0.8333 和弱邻居 0.1667；已测试的 V278 将缺失权重归自身，得到自身 0.95 和弱邻居 0.05。X36 单种子对照中，V278 相对原稀疏骨干改善 E-OSPA 与一致性，但条件 RMSE 退化，尚未跨尺度验证。最终按标签融合完整 LMB 后验以估计目标存在与位置。</desc>
  <rect width="1800" height="1260" fill="#ffffff"/>
  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#15364b">
    <!-- Main title and semantic status key. -->
    <rect x="52" y="38" width="206" height="46" rx="23" fill="#1262ad"/>
    <text x="155" y="69" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">已实现 · V242</text>
    <text x="281" y="75" font-size="41" font-weight="700">稀疏因果路由：先让信息到达，再决定如何融合</text>
    <text x="54" y="127" font-size="25" fill="#24516b">每条消息携带完整的多目标后验</text>
    <text x="1746" y="127" font-size="25" fill="#24516b" text-anchor="end">结构示意，非实验规模</text>

    <!-- Stage 1: causal inputs and a genuine three-formation network. -->
    <circle cx="72" cy="181" r="23" fill="#1262ad"/>
    <text x="72" y="189" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="109" y="190" font-size="29" font-weight="700">因果路由 → 消息计划</text>
    <rect x="52" y="214" width="1094" height="429" rx="28" fill="#eef7fd"/>
    <text x="82" y="264" font-size="25" font-weight="700">控制器只读取</text>
    <rect x="82" y="285" width="229" height="55" rx="17" fill="#ffffff" stroke="#1262ad" stroke-width="2"/>
    <circle cx="108" cy="313" r="7" fill="#1262ad"/>
    <text x="129" y="322" font-size="25">当前物理信息</text>
    <rect x="82" y="358" width="229" height="55" rx="17" fill="#ffffff" stroke="#1262ad" stroke-width="2"/>
    <path d="M101 387 A9 9 0 1 1 110 395" fill="none" stroke="#1262ad" stroke-width="3"/>
    <polygon points="103,398 104,388 113,397" fill="#1262ad"/>
    <text x="129" y="395" font-size="25">上一轮路由</text>
    <path d="M313 313 H333 V383 H361" fill="none" stroke="#1262ad" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M313 386 H333" fill="none" stroke="#1262ad" stroke-width="3.5"/>
    <polygon points="372,383 357,375 357,391" fill="#1262ad"/>
    <circle cx="100" cy="461" r="13" fill="#ffffff" stroke="#b34731" stroke-width="2.5"/>
    <path d="M91 452 L109 470" stroke="#b34731" stroke-width="2.5"/>
    <text x="125" y="470" font-size="25" fill="#8e3525">不读未来 / 真值</text>
    <text x="390" y="263" font-size="24" font-weight="700" fill="#1262ad">编队内：每个传感器保留 1 条有向环输入</text>

    <!-- The group labels and all sensors are topological, not field-of-view geometry. -->
    <g transform="translate(0 0)">
      <circle cx="464" cy="405" r="100" fill="#ffffff" stroke="#bedbec" stroke-width="2"/>
      <text x="464" y="303" font-size="24" font-weight="700" text-anchor="middle">编队 A</text>
      <path d="M483 353 Q531 371 522 410" fill="none" stroke="#1262ad" stroke-width="4" stroke-linecap="round"/>
      <polygon points="521,414 513,399 529,402" fill="#1262ad"/>
      <path d="M491 441 Q463 459 436 441" fill="none" stroke="#1262ad" stroke-width="4" stroke-linecap="round"/>
      <polygon points="433,439 450,440 443,453" fill="#1262ad"/>
      <path d="M405 411 Q391 369 442 351" fill="none" stroke="#1262ad" stroke-width="4" stroke-linecap="round"/>
      <polygon points="444,350 433,364 427,349" fill="#1262ad"/>
      <circle cx="464" cy="345" r="23" fill="#1262ad"/>
      <circle cx="514" cy="435" r="23" fill="#087f8c"/>
      <circle cx="414" cy="435" r="23" fill="#1262ad"/>
      <circle cx="514" cy="435" r="29" fill="none" stroke="#087f8c" stroke-width="2"/>
      <text x="464" y="353" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
      <text x="514" y="443" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
      <text x="414" y="443" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
      <text x="464" y="403" font-size="21" text-anchor="middle" fill="#1262ad">有向环</text>
    </g>
    <g transform="translate(277 0)">
      <circle cx="464" cy="405" r="100" fill="#ffffff" stroke="#bedbec" stroke-width="2"/>
      <text x="464" y="303" font-size="24" font-weight="700" text-anchor="middle">编队 B</text>
      <path d="M483 353 Q531 371 522 410" fill="none" stroke="#1262ad" stroke-width="4" stroke-linecap="round"/>
      <polygon points="521,414 513,399 529,402" fill="#1262ad"/>
      <path d="M491 441 Q463 459 436 441" fill="none" stroke="#1262ad" stroke-width="4" stroke-linecap="round"/>
      <polygon points="433,439 450,440 443,453" fill="#1262ad"/>
      <path d="M405 411 Q391 369 442 351" fill="none" stroke="#1262ad" stroke-width="4" stroke-linecap="round"/>
      <polygon points="444,350 433,364 427,349" fill="#1262ad"/>
      <circle cx="464" cy="345" r="23" fill="#1262ad"/>
      <circle cx="514" cy="435" r="23" fill="#087f8c"/>
      <circle cx="414" cy="435" r="23" fill="#087f8c"/>
      <circle cx="514" cy="435" r="29" fill="none" stroke="#087f8c" stroke-width="2"/>
      <circle cx="414" cy="435" r="29" fill="none" stroke="#087f8c" stroke-width="2"/>
      <text x="464" y="353" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
      <text x="514" y="443" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
      <text x="414" y="443" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
      <text x="464" y="403" font-size="21" text-anchor="middle" fill="#1262ad">有向环</text>
    </g>
    <g transform="translate(554 0)">
      <circle cx="464" cy="405" r="100" fill="#ffffff" stroke="#bedbec" stroke-width="2"/>
      <text x="464" y="303" font-size="24" font-weight="700" text-anchor="middle">编队 C</text>
      <path d="M483 353 Q531 371 522 410" fill="none" stroke="#1262ad" stroke-width="4" stroke-linecap="round"/>
      <polygon points="521,414 513,399 529,402" fill="#1262ad"/>
      <path d="M491 441 Q463 459 436 441" fill="none" stroke="#1262ad" stroke-width="4" stroke-linecap="round"/>
      <polygon points="433,439 450,440 443,453" fill="#1262ad"/>
      <path d="M405 411 Q391 369 442 351" fill="none" stroke="#1262ad" stroke-width="4" stroke-linecap="round"/>
      <polygon points="444,350 433,364 427,349" fill="#1262ad"/>
      <circle cx="464" cy="345" r="23" fill="#1262ad"/>
      <circle cx="514" cy="435" r="23" fill="#1262ad"/>
      <circle cx="414" cy="435" r="23" fill="#087f8c"/>
      <circle cx="414" cy="435" r="29" fill="none" stroke="#087f8c" stroke-width="2"/>
      <text x="464" y="353" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
      <text x="514" y="443" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
      <text x="414" y="443" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
      <text x="464" y="403" font-size="21" text-anchor="middle" fill="#1262ad">有向环</text>
    </g>
    <!-- Each formation-tree edge has two opposite directed gateway messages. -->
    <path d="M543 424 H650" fill="none" stroke="#087f8c" stroke-width="4"/>
    <polygon points="662,424 646,416 646,432" fill="#087f8c"/>
    <path d="M662 449 H555" fill="none" stroke="#087f8c" stroke-width="4"/>
    <polygon points="543,449 559,441 559,457" fill="#087f8c"/>
    <path d="M820 424 H927" fill="none" stroke="#087f8c" stroke-width="4"/>
    <polygon points="939,424 923,416 923,432" fill="#087f8c"/>
    <path d="M939 449 H832" fill="none" stroke="#087f8c" stroke-width="4"/>
    <polygon points="820,449 836,441 836,457" fill="#087f8c"/>
    <text x="749" y="541" font-size="24" font-weight="700" text-anchor="middle" fill="#087f8c">编队间：一棵树，每条树边正反向各 1 条网关消息</text>
    <text x="82" y="540" font-size="24" font-weight="700">保留可行编队树</text>
    <text x="82" y="576" font-size="24" font-weight="700">失效时少换树边</text>
    <text x="82" y="616" font-size="22" fill="#24516b">再比较可靠性、距离</text>
    <rect x="381" y="562" width="381" height="51" rx="25" fill="#d5ecf7"/>
    <text x="571" y="596" font-size="27" font-weight="700" text-anchor="middle" fill="#105180">计划消息 N + 2(F−1)</text>
    <text x="792" y="578" font-size="23" fill="#24516b">M24：30　X36：46</text>
    <text x="792" y="614" font-size="22" fill="#24516b">网关随当前物理条件实现</text>

    <!-- Stage 2: planned communication is not a receipt guarantee. -->
    <circle cx="1223" cy="181" r="23" fill="#1262ad"/>
    <text x="1223" y="189" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="1260" y="190" font-size="29" font-weight="700">实际投递：有到达，也有丢包</text>
    <rect x="1200" y="214" width="548" height="429" rx="28" fill="#f0fafb"/>
    <path d="M1148 406 H1179" fill="none" stroke="#1262ad" stroke-width="4"/>
    <polygon points="1193,406 1176,397 1176,415" fill="#1262ad"/>
    <text x="1229" y="265" font-size="24" font-weight="700" fill="#1262ad">完整后验消息</text>
    <rect x="1235" y="289" width="60" height="49" rx="6" fill="#ffffff" stroke="#1262ad" stroke-width="3"/>
    <path d="M1238 293 L1265 314 L1292 293" fill="none" stroke="#1262ad" stroke-width="3"/>
    <text x="1311" y="322" font-size="24">主要邻居</text>
    <path d="M1430 314 H1490" fill="none" stroke="#1262ad" stroke-width="4" stroke-dasharray="10 7"/>
    <path d="M1530 314 H1641 V360" fill="none" stroke="#b34731" stroke-width="3" stroke-dasharray="7 8" stroke-linejoin="round"/>
    <path d="M1498 302 L1520 324 M1520 302 L1498 324" fill="none" stroke="#b34731" stroke-width="5" stroke-linecap="round"/>
    <text x="1510" y="285" font-size="24" font-weight="700" text-anchor="middle" fill="#a03927">丢包</text>
    <rect x="1235" y="461" width="60" height="49" rx="6" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
    <path d="M1238 465 L1265 486 L1292 465" fill="none" stroke="#087f8c" stroke-width="3"/>
    <text x="1311" y="494" font-size="24">弱邻居</text>
    <path d="M1401 486 H1639 V458" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="1639,448 1631,463 1647,463" fill="#087f8c"/>
    <path d="M1471 460 L1480 468 L1496 449" fill="none" stroke="#087f8c" stroke-width="4" stroke-linecap="round"/>
    <text x="1524" y="465" font-size="23" font-weight="700" fill="#087f8c">到达</text>
    <circle cx="1640" cy="404" r="48" fill="#ffffff" stroke="#1262ad" stroke-width="4"/>
    <circle cx="1640" cy="404" r="36" fill="#deedf9"/>
    <text x="1640" y="413" font-size="25" font-weight="700" text-anchor="middle" fill="#1262ad">自身</text>
    <text x="1640" y="547" font-size="23" font-weight="700" text-anchor="middle">接收端</text>
    <text x="1229" y="587" font-size="25" font-weight="700" fill="#087f8c">丢包改变实际到达集合</text>
    <text x="1229" y="620" font-size="23" fill="#24516b">自身后验留在本地；邻居后验以送达为准</text>

    <!-- One unambiguous orthogonal connector to the receiver example. -->
    <path d="M1469 645 V684 H603 V709" fill="none" stroke="#1262ad" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="603,720 595,705 611,705" fill="#1262ad"/>
    <rect x="927" y="666" width="301" height="36" rx="18" fill="#ffffff"/>
    <text x="1078" y="691" font-size="23" font-weight="700" text-anchor="middle" fill="#1262ad">同一接收端 · 单轮丢包示例</text>

    <!-- Stage 3: preserve numeric and semantic distinction between baseline and candidate. -->
    <circle cx="72" cy="739" r="23" fill="#1262ad"/>
    <text x="72" y="747" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="109" y="748" font-size="29" font-weight="700">实际送达之后：两种权重处理</text>
    <rect x="52" y="773" width="1174" height="346" rx="28" fill="#f7fbfe"/>
    <text x="82" y="820" font-size="26" font-weight="700">计划权重</text>
    <circle cx="147" cy="900" r="51" fill="#1262ad"/>
    <text x="147" y="891" font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff">自身</text>
    <text x="147" y="925" font-size="27" font-weight="700" text-anchor="middle" fill="#ffffff">0.25</text>
    <circle cx="299" cy="900" r="51" fill="#ffffff" stroke="#1262ad" stroke-width="3"/>
    <text x="299" y="891" font-size="23" font-weight="700" text-anchor="middle" fill="#1262ad">主要</text>
    <text x="299" y="925" font-size="27" font-weight="700" text-anchor="middle" fill="#1262ad">0.70</text>
    <path d="M338 850 L358 870 M358 850 L338 870" fill="none" stroke="#b34731" stroke-width="5" stroke-linecap="round"/>
    <circle cx="451" cy="900" r="51" fill="#087f8c"/>
    <text x="451" y="891" font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff">弱邻居</text>
    <text x="451" y="925" font-size="27" font-weight="700" text-anchor="middle" fill="#ffffff">0.05</text>
    <path d="M299 966 V990" fill="none" stroke="#b34731" stroke-width="3"/>
    <text x="299" y="1022" font-size="24" font-weight="700" text-anchor="middle" fill="#a03927">权重 0.70 对应的消息丢失</text>
    <text x="299" y="1062" font-size="23" text-anchor="middle" fill="#24516b">自身 + 到达邻居参与融合</text>

    <!-- Branches are equally weighted visually; orange means unvalidated, not better. -->
    <path d="M511 900 H548 V849 H591" fill="none" stroke="#1262ad" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="603,849 587,841 587,857" fill="#1262ad"/>
    <path d="M548 901 V1016 H591" fill="none" stroke="#c96a15" stroke-width="3.5" stroke-dasharray="9 6" stroke-linejoin="round"/>
    <polygon points="603,1016 587,1008 587,1024" fill="#c96a15"/>
    <circle cx="548" cy="900" r="6" fill="#1262ad"/>
    <text x="625" y="817" font-size="25" font-weight="700" fill="#1262ad">当前基线：到达权重重新归一化</text>
    <rect x="625" y="843" width="442" height="31" fill="#1262ad"/>
    <rect x="1067" y="843" width="88" height="31" fill="#087f8c"/>
    <text x="625" y="911" font-size="26" font-weight="700" fill="#1262ad">自身 0.8333</text>
    <text x="1155" y="911" font-size="26" font-weight="700" fill="#087f8c" text-anchor="end">弱邻居 0.1667</text>
    <rect x="608" y="947" width="579" height="142" rx="20" fill="#fff8ee" stroke="#c96a15" stroke-width="2.5" stroke-dasharray="10 7"/>
    <text x="625" y="982" font-size="25" font-weight="700" fill="#9d4c07">V278 已测试：缺失权重归自身</text>
    <rect x="625" y="1006" width="503.5" height="31" fill="#1262ad"/>
    <rect x="1128.5" y="1006" width="26.5" height="31" fill="#087f8c"/>
    <text x="625" y="1072" font-size="26" font-weight="700" fill="#1262ad">自身 0.95</text>
    <text x="1155" y="1072" font-size="26" font-weight="700" fill="#087f8c" text-anchor="end">弱邻居 0.05</text>

    <!-- Stage 4: target posterior readout, not a connectivity endpoint. -->
    <circle cx="1318" cy="739" r="23" fill="#237148"/>
    <text x="1318" y="747" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text x="1355" y="748" font-size="29" font-weight="700">逐标签 LMB-KLA</text>
    <path d="M1228 948 H1276" fill="none" stroke="#237148" stroke-width="4"/>
    <polygon points="1289,948 1272,939 1272,957" fill="#237148"/>
    <rect x="1295" y="773" width="453" height="346" rx="28" fill="#eff9f1"/>
    <text x="1522" y="819" font-size="25" font-weight="700" text-anchor="middle" fill="#237148">融合完整后验，估计目标状态</text>
    <text x="1416" y="872" font-size="24" font-weight="700" text-anchor="middle" fill="#237148">标签 ℓ₁</text>
    <text x="1626" y="872" font-size="24" font-weight="700" text-anchor="middle" fill="#237148">标签 ℓ₂</text>
    <ellipse cx="1416" cy="938" rx="72" ry="46" fill="#d2ecda" stroke="#237148" stroke-width="2.5"/>
    <ellipse cx="1416" cy="938" rx="43" ry="27" fill="#b2ddc1" stroke="#237148" stroke-width="2"/>
    <path d="M1396 938 H1436 M1416 918 V958" stroke="#237148" stroke-width="2.5"/>
    <circle cx="1416" cy="938" r="6" fill="#175a38"/>
    <ellipse cx="1626" cy="938" rx="58" ry="41" fill="#d2ecda" stroke="#237148" stroke-width="2.5"/>
    <ellipse cx="1626" cy="938" rx="32" ry="24" fill="#b2ddc1" stroke="#237148" stroke-width="2"/>
    <path d="M1606 938 H1646 M1626 918 V958" stroke="#237148" stroke-width="2.5"/>
    <circle cx="1626" cy="938" r="6" fill="#175a38"/>
    <text x="1522" y="1026" font-size="27" font-weight="700" text-anchor="middle" fill="#237148">目标是否存在？ 目标在哪里？</text>
    <text x="1522" y="1073" font-size="23" text-anchor="middle" fill="#285d40">存在概率 + 位置估计</text>

    <!-- The research question and the claim boundary stay on the main visual. -->
    <path d="M54 1159 H1746" stroke="#c6e2ec" stroke-width="2"/>
    <text x="900" y="1200" font-size="31" font-weight="700" text-anchor="middle">关注：目标信息有没有到达，到达后是否保住</text>
    <text x="900" y="1239" font-size="23" text-anchor="middle" fill="#24516b">X36 相对原稀疏骨干：E-OSPA 与一致性改善，条件 RMSE 退化；尚未跨尺度验证。</text>
  </g>
</svg>
